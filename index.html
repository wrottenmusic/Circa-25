<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circa '25 - Victor Wrott</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #050505;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px 140px 20px;
            overflow-x: hidden;
        }

        /* Animated Background Glow */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #5e00ff, #ff0077, #00d4ff);
            filter: blur(120px);
            opacity: 0.25;
            z-index: -1;
            animation: moveBackground 12s infinite alternate ease-in-out;
        }

        @keyframes moveBackground {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }

        /* Main Glassmorphism Card */
        .player-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            padding: 30px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            margin-bottom: 30px;
        }

        .cover-art {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }

        .artist {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 25px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* YouTube Container */
        .stream-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stream-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Action Buttons */
        .btn {
            display: block;
            text-decoration: none;
            font-weight: 700;
            transition: 0.3s ease;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.92;
        }

        .btn-yt {
            background: #ff0000;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .links-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px;
            border-radius: 14px;
            color: white;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Download Button - Highlighted */
        .btn-download {
            background: #ffffff;
            color: #000;
            padding: 18px;
            border-radius: 18px;
            font-size: 15px;
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
            margin-top: 4px;
        }

        .btn-download:hover {
            background: #e8e8e8;
            transform: translateY(-2px) scale(1.02);
        }

        /* Euphonic Sounds Footer Credits */
        .label-credits {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.8;
        }

        .label-link {
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            transition: 0.3s;
            font-weight: 800;
        }

        .label-link:hover {
            color: #00d4ff;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        /* Fixed Social Bar */
        .social-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 25px;
            border-radius: 40px;
            display: flex;
            gap: 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .social-link {
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            opacity: 0.65;
            transition: 0.3s;
        }

        .social-link:hover {
            opacity: 1;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <main class="player-card">
        <img src="circa%20cover.png" alt="Circa '25 Cover Art" class="cover-art">
        <h1>Circa '25</h1>
        <p class="artist">Victor Wrott</p>

        <div class="stream-box">
            <iframe
                src="https://www.youtube-nocookie.com/embed/videoseries?list=PLGZpU2mXAQXE&index=1&shuffle=1"
                title="Circa '25 YouTube Playlist"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>

        <a href="https://youtube.com/@victorwrott" target="_blank" rel="noopener noreferrer" class="btn btn-yt">
            SUBSCRIBE ON YOUTUBE
        </a>

        <div class="links-grid">
            <a href="https://audiomack.com/victorwrott/album/circa-25" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                LISTEN ON AUDIOMACK
            </a>
        </div>

        <a href="https://www.dropbox.com/scl/fi/83hys6hb5xuk9crcd1xda/Circa-25-victor-wrott.zip?rlkey=1dhtedzqt4aef9ups7qelkyjm&st=75ab70h7&dl=1" target="_blank" rel="noopener noreferrer" class="btn btn-download">
            DOWNLOAD FULL EP (.ZIP)
        </a>

        <footer class="label-credits">
            <p>© 2026 <a href="#euphonic-sounds" class="label-link">Euphonic Sounds</a></p>
            <p>Recorded &amp; Mixed at Euphonic Studios</p>
        </footer>
    </main>

    <nav class="social-bar" aria-label="Social Links">
        <a href="https://twitter.com/victorwrott" target="_blank" rel="noopener noreferrer" class="social-link">Twitter</a>
        <a href="https://youtube.com/victorwrott" target="_blank" rel="noopener noreferrer" class="social-link">YT</a>
        <a href="https://facebook.com/wrottmusic" target="_blank" rel="noopener noreferrer" class="social-link">FB</a>
        <a href="https://instagram.com/victorwrott" target="_blank" rel="noopener noreferrer" class="social-link">IG</a>
        <a href="https://snapchat.com/add/victorwrott" target="_blank" rel="noopener noreferrer" class="social-link">Snap</a>
    </nav>

</body>
</html>
